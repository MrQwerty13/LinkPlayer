[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkplayer"
version = "1.0.0"
description = "LinkPlayer — macOS GUI downloader for VK Video, YouTube and Rutube (PySide6 + yt-dlp)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mikhail Pozur" }]
dependencies = [
    "PySide6>=6.5",
    "yt-dlp>=2024.4.9",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-mock",
    "pytest-cov",
    "pyinstaller",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Kept in sync with pytest.ini
testpaths = ["tests"]
addopts = "-q --cov=linkplayer --cov-report=term-missing --cov-report=xml"
